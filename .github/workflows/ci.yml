name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install ".[dev]" "build>=1.2,<2"
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: CLI smoke test
        run: |
          ach doctor
          ach audit --format json --output audit.json
          ach dedupe plan --format json
      - name: Build and verify distributions
        run: |
          python -m build
          python scripts/verify_distribution.py
